name: Jalankan Prediksi & Simpan Hasil
on:
  workflow_dispatch:
    description: Jalankan prediksi secara manual
  schedule:
    # WIB = UTC + 7 → 09.00 WIB = 02:00 UTC
    - cron: '0 2 * * *'
jobs:
  prediksi:
    name: Prediksi Shio Otomatis
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Ambil kode dari repositori
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Siapkan Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pasang pustaka dari requirements.txt
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Jalankan prediksi
        run: python cari_shio.py
      - name: Simpan hasil ke repositori
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Tarik dulu → atasi error rejected / fetch first
          git pull origin main --rebase --autostash || true
          
          git add hasil_prediksi.json
          
          # Cek apakah ada perubahan untuk dikirim
          if git diff --staged --quiet; then
            echo "ℹ️ Tidak ada perubahan hasil — selesai"
          else
            TANGGAL=$(date +'%Y-%m-%d %H:%M:%S')
            git commit -m "Update otomatis: ${TANGGAL} WIB"
            git push origin main
          fi
