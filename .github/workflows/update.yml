name: Auto Update Shio
run-name: 🔄 Update prediksi shio & 2D — ${{ github.event_name }}

on:
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: 📂 Ambil kode
        uses: actions/checkout@v4

      - name: 🐍 Siapkan Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Pasang pustaka
        run: |
          python -m pip install --upgrade pip
          pip install tensorflow-cpu optuna numpy

      - name: 🚀 Jalankan prediksi
        run: python cari_shio.py

      - name: 💾 Simpan hasil
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add hasil_prediksi.json
          git commit -m "🤖 Update: $(date +'%Y-%m-%d %H:%M:%S') WIB" || echo "Tidak ada perubahan"
          git push
