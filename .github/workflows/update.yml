name: Auto Update Shio
run-name: 🔄 Update prediksi shio & 2D — ${{ github.event_name }}

on:
  schedule:
    - cron: '0 0,12 * * *'   # 07.00 WIB & 19.00 WIB tiap hari
  workflow_dispatch:          # Jalankan manual lewat halaman Actions

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180        # Berhenti sendiri jika lebih 10 menit
    steps:
      - name: 📂 Ambil kode dari repositori
        uses: actions/checkout@v4

      - name: 🐍 Siapkan Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'         # Simpan pustaka → pasang ulang jadi detik

      - name: 📦 Pasang pustaka yang dibutuhkan
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt

      - name: 🚀 Jalankan prediksi
        run: python cari_shio.py

      - name: 💾 Simpan hasil ke repositori
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add hasil_prediksi.json
          git commit -m "🤖 Update otomatis: $(date +'%Y-%m-%d %H:%M:%S') WIB" || echo "Tidak ada perubahan data"
          git push
